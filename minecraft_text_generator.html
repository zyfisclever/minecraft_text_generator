<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft Pixel Font Generator</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1b2430;--line:#344253;--text:#edf3fa;--muted:#a8b5c5;--accent:#62c7a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 6px;font-size:26px}p{color:var(--muted);margin:4px 0 16px}
.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px 10px;background:#101923;border:1px solid var(--line);border-radius:8px;color:var(--text)}
textarea{min-height:105px;resize:vertical}input[type=color]{height:42px;padding:4px}input[type=checkbox]{width:auto;transform:scale(1.15);margin-right:8px}
.coords{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#092019;font-weight:750;cursor:pointer;margin-top:14px}
button.secondary{background:#344253;color:var(--text)}button:disabled{opacity:.5;cursor:not-allowed}
.preview{min-height:280px;background-color:#0b1016;background-image:linear-gradient(45deg,#1c2733 25%,transparent 25%),linear-gradient(-45deg,#1c2733 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1c2733 75%),linear-gradient(-45deg,transparent 75%,#1c2733 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border-radius:10px;overflow:auto;padding:14px;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;max-width:100%;height:auto;max-height:520px}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:10px 0}
#commands{height:210px;font:12px/1.45 ui-monospace,Consolas,monospace}
.note{font-size:13px;color:var(--muted);margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🧱 Minecraft 像素字符生成器</h1>
<p>输入中英文 → 生成像素预览 → 导出 Java 版 /fill 命令（每个像素格对应一个方块）。</p>
<div class="layout">
<section class="panel">
<label for="words">要生成的文字</label>
<textarea id="words">你好
Minecraft!</textarea>
<label for="font">字体</label>
<select id="font">
<option value='"Microsoft YaHei", "Noto Sans CJK SC", sans-serif'>微软雅黑 / 系统中文字体</option>
<option value='"SimHei", "Noto Sans CJK SC", sans-serif'>黑体</option>
<option value='serif'>衬线字体</option>
<option value='monospace'>等宽字体</option>
</select>
<label for="size">字高（方块）</label>
<input id="size" type="number" min="8" max="64" value="16">
<label>文字颜色与背景</label>
<div class="colors">
<div><label for="fg">文字方块</label><input id="fg" type="color" value="#ffffff"></div>
<div><label for="bg">背景方块</label><input id="bg" type="color" value="#202020"></div>
</div>
<label><input id="background" type="checkbox">生成实心背景（不勾选则只生成文字）</label>
<label>建筑起点（文字左上角）</label>
<div class="coords">
<input id="x" type="number" value="0" title="X坐标" aria-label="X坐标">
<input id="y" type="number" value="100" title="Y坐标" aria-label="Y坐标">
<input id="z" type="number" value="0" title="Z坐标" aria-label="Z坐标">
</div>
<label for="plane">文字所在平面</label>
<select id="plane"><option value="xy">正面朝 Z 轴（宽度沿 X，高度沿 Y）</option><option value="xz">正面朝 Y 轴（宽度沿 X，高度沿 Z）</option></select>
<button id="generate">生成预览和命令</button>
<div class="note">提示：中文效果取决于电脑已安装的字体。建议先用小文字测试。坐标起点是文字左上角；命令会向右、向下铺设。</div>
</section>
<section class="panel">
<h2 style="margin:0 0 10px;font-size:18px">像素预览</h2>
<div class="preview"><canvas id="canvas" width="1" height="1"></canvas></div>
<div class="stats"><span id="dimensions">尺寸：尚未生成</span><span id="count">命令：0</span></div>
<div class="row">
<button id="copy" class="secondary" disabled>复制全部命令</button>
<button id="download" class="secondary" disabled>下载 .mcfunction</button>
</div>
<label for="commands">命令预览</label>
<textarea id="commands" readonly placeholder="点击“生成预览和命令”后显示……"></textarea>
<p class="note">导出的 .mcfunction 每行一条命令，不带开头的斜杠。把文件放进存档的 datapacks 数据包函数目录后，可在游戏中用 /function 命名空间:文件名 执行。也可以逐条复制到命令方块中执行。</p>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let generated='';
function hexToBlock(hex){
 const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
 const palette={white:[0xf0f0f0,'white_concrete'],orange:[0xf9801d,'orange_concrete'],magenta:[0xc74ebd,'magenta_concrete'],light_blue:[0x3ab3da,'light_blue_concrete'],yellow:[0xfed83d,'yellow_concrete'],lime:[0x80c71f,'lime_concrete'],pink:[0xf38baa,'pink_concrete'],gray:[0x474f52,'gray_concrete'],light_gray:[0x9d9d97,'light_gray_concrete'],cyan:[0x169c9c,'cyan_concrete'],purple:[0x8932b8,'purple_concrete'],blue:[0x3c44aa,'blue_concrete'],brown:[0x835432,'brown_concrete'],green:[0x5e7c16,'green_concrete'],red:[0xb02e26,'red_concrete'],black:[0x1d1d21,'black_concrete']};
 let best=null,dist=Infinity;
 for(const [name,[v,block]] of Object.entries(palette)){const rr=v>>16&255,gg=v>>8&255,bb=v&255,d=(r-rr)**2+(g-gg)**2+(b-bb)**2;if(d<dist){dist=d;best=block}}
 return 'minecraft:'+best;
}
function render(){
 const text=$('words').value;
 if(!text.trim()){alert('先输入一些文字。');return}
 const cell=8,fs=Math.max(8,Math.min(64,Number($('size').value)||16))*cell;
 const lines=text.split('\n');
 const measure=document.createElement('canvas').getContext('2d');
 const family=$('font').value;
 measure.font=`bold ${fs}px ${family}`;
 const widths=lines.map(s=>Math.ceil(measure.measureText(s||' ').width));
 const lineH=Math.ceil(fs*1.35),pad=cell;
 const W=Math.max(1,Math.max(...widths)+pad*2),H=Math.max(1,lines.length*lineH+pad);
 if(W*H>16000000){alert('文字太多，请缩短文本或减小字号。');return}
 const src=document.createElement('canvas');src.width=W;src.height=H;
 const c=src.getContext('2d',{willReadFrequently:true});
 c.clearRect(0,0,W,H);c.fillStyle='#fff';c.font=`bold ${fs}px ${family}`;c.textBaseline='alphabetic';
 lines.forEach((s,i)=>c.fillText(s,pad,i*lineH+fs));
 const gw=Math.ceil(W/cell),gh=Math.ceil(H/cell),data=c.getImageData(0,0,W,H).data;
 const pixels=Array.from({length:gh},()=>Array(gw).fill(false));
 for(let yy=0;yy<gh;yy++)for(let xx=0;xx<gw;xx++){
   let hit=false;
   for(let sy=yy*cell;sy<Math.min(H,(yy+1)*cell)&&!hit;sy++)
    for(let sx=xx*cell;sx<Math.min(W,(xx+1)*cell);sx++)if(data[(sy*W+sx)*4+3]>100){hit=true;break}
   pixels[yy][xx]=hit;
 }
 const cv=$('canvas');cv.width=gw;cv.height=gh;
 const out=cv.getContext('2d');out.clearRect(0,0,gw,gh);
 for(let yy=0;yy<gh;yy++)for(let xx=0;xx<gw;xx++)if(pixels[yy][xx]){out.fillStyle=$('fg').value;out.fillRect(xx,yy,1,1)}
 const x0=Number($('x').value)||0,y0=Number($('y').value)||0,z0=Number($('z').value)||0;
 const fg=hexToBlock($('fg').value),bg=hexToBlock($('bg').value),solid=$('background').checked,plane=$('plane').value;
 const cmds=[];
 for(let yy=0;yy<gh;yy++){
   let xx=0;
   while(xx<gw){
     const isText=pixels[yy][xx];
     if(!isText&&!solid){xx++;continue}
     let end=xx+1;
     while(end<gw && pixels[yy][end]===isText)end++;
     const block=isText?fg:bg;
     let ax=x0+xx,bx=x0+end-1,ay=plane==='xy'?y0-yy:y0,by=plane==='xy'?ay:ay,az=plane==='xy'?z0:z0+yy,bz=az;
     cmds.push(`/fill ${ax} ${ay} ${az} ${bx} ${by} ${bz} ${block}`);
     xx=end;
   }
 }
 generated=cmds.join('\n');
 $('commands').value=generated;
 $('dimensions').textContent=`尺寸：${gw} × ${gh} 格`;
 $('count').textContent=`命令：${cmds.length} 条`;
 $('copy').disabled=!generated;$('download').disabled=!generated;
}
$('generate').addEventListener('click',render);
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(generated);$('copy').textContent='已复制！';setTimeout(()=>$('copy').textContent='复制全部命令',1300)}catch(e){$('commands').focus();$('commands').select();document.execCommand('copy')}});
$('download').addEventListener('click',()=>{const blob=new Blob([generated.replaceAll('/fill ','fill ')+'\n'],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pixel-art.mcfunction';a.click();URL.revokeObjectURL(a.href)});
render();
</script>
</body>
</html>
